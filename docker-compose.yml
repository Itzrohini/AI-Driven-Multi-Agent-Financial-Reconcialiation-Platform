
services:
  api:
    build: 
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
    volumes:
      - ./data:/data
      - ./backend:/app
    depends_on:
      - mongo
      - qdrant

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
    volumes:
      - ./data:/data
      - ./backend:/app
    depends_on:
      - mongo
      - qdrant
      - redis

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
